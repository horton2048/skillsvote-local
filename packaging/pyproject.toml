[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillsvote"
version = "0.2.0"
description = "Local-first, personalized 'should I install this skill?' assessor for Claude Code agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "skills-vote-scoring" }]
keywords = ["claude-code", "agent-skills", "mcp", "skill-recommendation"]
dependencies = ["pydantic>=2.0", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/horton2048/skillsvote-local"
Upstream = "https://github.com/MemTensor/skills-vote"

[project.scripts]
skillsvote = "skillsvote.cli:run"

# Self-contained: the package lives right here in ./skillsvote, so wheel, sdist
# and git installs all build cleanly (no reaching outside the project root).
[tool.hatch.build.targets.wheel]
packages = ["skillsvote"]

[tool.hatch.build.targets.sdist]
include = ["skillsvote", "README.md", "pyproject.toml"]
