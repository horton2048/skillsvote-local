[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillsvote"
version = "0.1.0"
description = "Local-first, personalized 'should I install this skill?' assessor for Claude Code agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "skills-vote-scoring" }]
keywords = ["claude-code", "agent-skills", "mcp", "skill-recommendation"]
dependencies = ["pydantic>=2.0", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/MemTensor/skills-vote"

[project.scripts]
skillsvote = "skills_vote.score.cli:run"

# Single source of truth: the code lives in ../src/skills_vote/score. We ship
# only that subpackage (plus an empty package init) with minimal deps, leaving
# the heavy research modules (harbor, claude-agent-sdk) out of the distribution.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"../src/skills_vote/__init__.py" = "skills_vote/__init__.py"
"../src/skills_vote/score" = "skills_vote/score"

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "README.md"]

[tool.hatch.build.targets.sdist.force-include]
"../src/skills_vote/__init__.py" = "src/skills_vote/__init__.py"
"../src/skills_vote/score" = "src/skills_vote/score"
