name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel
        working-directory: packaging
        # Wheel-only: the package force-includes sources from ../src, which only
        # resolves against the repo checkout (not an extracted sdist), so the
        # default sdist->wheel chain can't be used here.
        run: uv build --wheel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skillsvote-dist
          path: packaging/dist/*.whl

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/*.whl
          generate_release_notes: true
