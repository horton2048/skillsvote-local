name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        working-directory: packaging
        run: |
          uv build
          rm -f dist/.gitignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skillsvote-dist
          path: packaging/dist/*

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/*
          generate_release_notes: true

  # Publishes to PyPI via OIDC Trusted Publishing (no token/secret needed).
  # Requires a one-time "pending publisher" configured on PyPI:
  #   project=skillsvote, owner=horton2048, repo=skillsvote-local, workflow=release.yml
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        working-directory: packaging
        run: |
          uv build
          rm -f dist/.gitignore

      - name: Publish to PyPI (trusted publishing)
        working-directory: packaging
        run: uv publish --trusted-publishing always
